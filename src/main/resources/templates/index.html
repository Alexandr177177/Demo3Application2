<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Resumes List</title>
    <link href="/css/style.css" rel="stylesheet" type="text/css"/>
    <!--    <script src="/js/index.js"></script>-->
    <style>
        /* Сброс отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5ebea; /* Коричнево-бежевый фон */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; /* Отступ сверху для центрирования контента */
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #d7bda9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1900px;
        }



        .name {
            display: flex;
            align-items: center; /* Выравнивание по вертикали */
            justify-content: space-between; /* Распределение между краями */
            background-color: yellow;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 4px 4px 10px rgba(255, 0, 0, 0.3);
            font-size: 25px;
            margin-bottom: 10px;
            width: 100%;
        }

        .image-name-wrapper {
            display: flex;
            align-items: center;
            gap: 15px; /* Отступ между фото и именем */
            flex-grow: 1;
            min-width: 0;
        }

        .name-class {
            font-weight: bold;
            font-size: 25px;
        }

        .item {
            display: flex;
            /*flex-direction: column;*/
            gap: 15px;
        }
        .button-class {
            font-size: 16px;
            font-weight: bold;

        }


        .action {
            background-color: gray;
            color: coral;
            padding: 6px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .action:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<!-- Блок с заголовком по центру -->
<div class="header">
    <h1>Resumes List</h1>
</div>
<div class="create-button">
    <a th:href="@{/resumes/create}" class="action">Create</a>
</div>
<!-- Основной контейнер -->
<div class="container">

    <ul>
        <li th:each="employee : ${employees}">
            <div class="item">
                <div class="name">
                    <!-- Фото и имя -->
                    <div class="image-name-wrapper">
                        <!-- Фото -->
                        <img th:if="${employee.image != null and employee.image != ''}"
                             th:src="@{${employee.image}}"
                             alt="Фото сотрудника"
                             style="width: 50px; height: 50px; border-radius: 10px;" />
                        <p th:if="${employee.image == null or employee.image == ''}">
                            Нет фото
                        </p>

                        <!-- Имя -->
                        <a th:href="@{/resumes/{id}(id=${employee.id})}" class="name-class">
                            <span th:text="${employee.name}"></span>
                        </a>
                    </div>

                    <!-- Кнопки Update и Delete -->
                    <div class="button-class">
                        <a th:href="@{/resumes/edit/{id}(id=${employee.id})}" class="action">Update</a>
                        <a th:href="@{/resumes/delete/{id}(id=${employee.id})}"
                           onclick="return confirmDelete()" class="action">Delete</a>
                    </div>
                </div>
            </div>
        </li>
    </ul>
</div>

<script>
    function confirmDelete() {
        return confirm("Are you sure you want to delete this resume?");
    }
</script>

</body>
</html>
